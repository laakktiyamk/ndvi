name: Build, Push and Deploy NDVI App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/ndvi-test:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Executing remote ssh commands to deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 0. Kirjaudutaan Docker Hubiin
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

          # 1. Pysäytetään vanha kontti
          docker stop ndvi-test || true

          # 2. Poistetaan vanha kontti
          docker rm ndvi-test || true

          # 3. Ladataan uusin versio Docker Hubista
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ndvi-test:latest

          # 4. Käynnistetään kontti ympäristömuuttujilla
          docker run -d \
            -p 80:8000 \
            -e MONGO_URI="${{ secrets.MONGO_URI }}" \
            -e SECRET="${{ secrets.SECRET }}" \
            -e PORT="8000" \
            -e sentinelHubClientId="${{ secrets.SENTINEL_HUB_CLIENT_ID }}" \
            -e sentinelHubClientSecret="${{ secrets.SENTINEL_HUB_CLIENT_SECRET }}" \
            -e MML_API_KEY="${{ secrets.MML_API_KEY }}" \
            --name ndvi-test \
            --restart unless-stopped \
            ${{ secrets.DOCKERHUB_USERNAME }}/ndvi-test:latest

          # 5. Siivotaan vanhat imaget
          docker image prune -f